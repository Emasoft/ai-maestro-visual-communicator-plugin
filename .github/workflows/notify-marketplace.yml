# Notify the ai-maestro-plugins marketplace when this plugin is updated.
# Requires MARKETPLACE_PAT secret on this repo (PAT with `repo` scope on the
# marketplace repo). Configure once via:
#   gh secret set MARKETPLACE_PAT --repo Emasoft/ai-maestro-visual-communicator-plugin --body "$MARKETPLACE_PAT"

name: Notify Marketplace

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'
      - 'commands/**'
      - 'scripts/**'
      - 'templates/**'
      - 'references/**'
      - 'SKILL.md'

permissions:
  contents: read

env:
  MARKETPLACE_OWNER: 'Emasoft'
  MARKETPLACE_REPO: 'ai-maestro-plugins'

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: get plugin info
        id: plugin
        # E3 — lift `${{ github.event.repository.name }}` and
        # `${{ github.sha }}` into a step `env:` block per the project
        # gh-actions.md rule. These are GitHub-supplied values, not
        # user input, so the actual injection risk is zero — but
        # consistency with the project rule wins.
        env:
          NAME: ${{ github.event.repository.name }}
          REF:  ${{ github.sha }}
        run: |
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "ref=$REF"   >> "$GITHUB_OUTPUT"

      - name: trigger marketplace update
        # E2 — bump from v3 to v4. v4 moves to the node20 runner;
        # node16 actions are deprecation-pressured by GitHub. No
        # breaking input changes for the token/repository/event-type
        # /client-payload set used here.
        # B4 (TRDD-5f41ad36) — upgraded from tag pin (`@v4`) to full
        # commit-SHA pin per the project gh-actions.md rule.
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.MARKETPLACE_PAT }}
          repository: ${{ env.MARKETPLACE_OWNER }}/${{ env.MARKETPLACE_REPO }}
          event-type: plugin-updated
          client-payload: |
            {
              "plugin": "${{ steps.plugin.outputs.name }}",
              "ref": "${{ steps.plugin.outputs.ref }}",
              "source_repo": "${{ github.repository }}",
              "triggered_by": "${{ github.actor }}"
            }

      - name: summary
        # B1 (TRDD-5f41ad36) — actionlint flagged these as SC2086 (unquoted
        # variable expansion) and SC2129 (multiple redirects). Quoting
        # `$GITHUB_STEP_SUMMARY` is harmless on GitHub runners (the var
        # never contains spaces) but the linter is right to flag it as
        # a foot-gun. Combining into a single brace-block also makes the
        # diff easier to scan.
        env:
          PLUGIN_NAME: ${{ steps.plugin.outputs.name }}
          PLUGIN_REF: ${{ steps.plugin.outputs.ref }}
        run: |
          {
            echo "## Marketplace Notification"
            echo
            echo "Triggered update in ${{ env.MARKETPLACE_OWNER }}/${{ env.MARKETPLACE_REPO }}"
            echo
            echo "- Plugin: $PLUGIN_NAME"
            echo "- Commit: $PLUGIN_REF"
          } >> "$GITHUB_STEP_SUMMARY"
