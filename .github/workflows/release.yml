name: release

# Fires when a vX.Y.Z tag is pushed (typically by `scripts/publish.py --push`,
# or by hand via `git push origin vX.Y.Z`). Creates a GitHub Release whose
# body is the matching `## [X.Y.Z] — YYYY-MM-DD` section of CHANGELOG.md.
#
# The publish.py pipeline already produces a local commit + tag in lockstep
# (chore(release): vX.Y.Z + tag vX.Y.Z + CHANGELOG.md regeneration); the
# release body therefore matches what was committed for that tag.

on:
  push:
    tags:
      - 'v*'

# Top-level permissions: minimal — the job overrides with `contents: write`
# where the release-write step actually needs it. Finer-grained scope per
# gh-actions.md best practice (canon uses `permissions: {}` at the workflow
# level; we keep the explicit empty block here too for clarity).
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release in flight

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # B5 (canonical-pipeline-migration step 6) — bumped from 5 → 15 minutes
    # because we now run validate + lint + mypy + smoke-tests inside the
    # release job. The validate-on-tag gate is a defensive safety net:
    # if someone pushes a tag separately (`git push origin v1.2.3` after
    # the branch already shipped), the local pre-push hook's gate is
    # bypassed; the release.yml gate catches that case.
    timeout-minutes: 15
    permissions:
      # Job-level permissions (finer-grained than the workflow-level
      # `contents: write` block — keeps the principle of least privilege).
      contents: write       # create the release + upload assets
      id-token: write       # OIDC token for build-provenance attestation
      attestations: write   # write the provenance attestation
    steps:
      - uses: actions/checkout@v6
        with:
          # Need full history so the tag's commit is reachable when we
          # extract notes / check for prior tags.
          fetch-depth: 0

      - name: install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: run full plugin validation (strict — same gate as pre-push)
        # B5 — pre-release safety net. If the tag points at a commit that
        # doesn't pass strict validation, refuse the release rather than
        # ship a broken plugin. Mirrors canon's pre-release gate AND
        # honors the documented-known-exception allowlist (publish.py
        # step 14 — G3 wraps the raw exit code with the per-finding
        # allowlist from plugin.json::cpv._intentional_validator_false_positives).
        run: uv run python scripts/publish.py --gate-validate

      - name: ruff lint scripts/
        # B5 — block release on ruff failures. Local pre-push runs the
        # same gate via publish.py G2; CI redundancy catches any drift
        # where the tag commit somehow has lint errors.
        run: |
          uv tool install ruff
          ruff check scripts/

      - name: mypy type-check scripts/
        # B5 — additional type-safety gate. --ignore-missing-imports
        # matches canon's invocation and avoids failing on third-party
        # libs without stubs.
        run: |
          uv tool install mypy
          mypy scripts/ --ignore-missing-imports

      - name: smoke-test the test runner
        # The full 360-test dev-browser suite can't run on stock GitHub
        # runners (no dev-browser CLI, no Chrome). Smoke-check that the
        # runner sources parse — catches Python syntax breakage at the
        # release boundary without needing the full browser stack.
        run: |
          uv run --python 3.12 python -m py_compile \
            tests/run-all-tests.py \
            tests/run-tests.py \
            tests/server.py

      - name: Generate SBOM (SPDX)
        # Supply-chain control. amvcp ships no built binary and its own
        # manifests declare zero deps (package.json has no dependencies;
        # uv.lock holds only the project itself), so without this step
        # nothing enumerates the vendored builds' dependency trees.
        #
        # MEASURED COVERAGE — syft 1.51.1 was the version used for THESE LOCAL
        # measurements (`anchore/syft:latest` reported Version 1.51.1,
        # BuildDate 2026-08-27). That is NOT necessarily CI's: sbom-action
        # pins its own syft internally, and its `syft-version` input has no
        # default, so the version this step actually runs is unverified here.
        # Measured against the WHOLE
        # tracked tree, matching this step's `path: .`. Substrate is
        # `git archive <ref>` extracted to a temp dir; no .gitattributes
        # exists, so there is no export-ignore divergence from
        # actions/checkout:
        #   before tracking pierre-diffs' bun.lock  → 234 packages
        #   after                                   → 288 packages  (+54)
        #
        # Per-directory attribution (scanned individually, so these are
        # SUBSETS and do not sum to the totals above):
        #   vendor/regex-vis    → 221, from its tracked package-lock.json
        #   vendor/pierre-diffs →  51, from its tracked bun.lock
        # The remainder comes from root-level manifests this step also
        # catalogs. SCOPE MATTERS: an earlier revision of this comment quoted
        # 221/275 — those are `vendor/`-only figures, and this step does not
        # scan `vendor/` alone. The DELTA was the same either way (+54, all of
        # it inside the vendored subtree), but the totals were wrong for what
        # actually ships.
        #
        # BOTH vendored projects are now covered. pierre-diffs used to report
        # 0 because `.gitignore` carried `vendor/*/bun.lock`, so the lockfile
        # never reached a runner. That rule was accidental — it sat among the
        # build-artefact ignores (node_modules/, dist/) while regex-vis's
        # package-lock.json was always tracked — and was removed. syft DOES
        # parse bun.lock: scanned standalone, the bare file yields 55; in the
        # archive tree alongside package.json it yields 51.
        #
        # What the regex-vis 221 ARE: its lockfile holds 283 distinct
        # name@version pairs and syft emits 221. All 64 it omits are
        # dev-flagged (48 also optional — the @esbuild/<platform> binaries,
        # babel plugins, and friends), and NOT ONE production package is
        # missing. The precise claim that was verified is that second one:
        # zero production packages omitted. (283−64=219 while syft emits 221,
        # so "the 221 are exactly the production tree" is ~2 looser than the
        # measurement; the slack direction is over-listing, which fails safe.)
        # Do not "fix" the 283→221 delta — it is the dev tree, by design.
        #
        # THIRD_PARTY_NOTICES.md remains the human-readable enumeration.
        #
        # TWO LIMITS ON EVERY NUMBER ABOVE — do not read them as the SBOM this
        # step emits:
        #  1. They come from `syft scan dir:` run directly (Docker). This step
        #     runs anchore/sbom-action, which wraps syft with its own config
        #     and cataloger selection. Same engine, not the same invocation, so
        #     these are the closest reproducible proxy — not the artifact.
        #  2. They are measured on a PRISTINE archive, but this step runs
        #     LATE in the job — after checkout, setup-uv, `uv run python
        #     scripts/publish.py --gate-validate`, and two `uv tool install`
        #     steps. pyproject.toml declares a [project], so that `uv run`
        #     MATERIALISES `.venv/` in the repo root, and `.venv` is
        #     gitignored — so it is absent from the archive but PRESENT at
        #     `path: .` when syft runs. Checked: nothing before this step runs
        #     npm/bun/yarn/pnpm or a vendor build, so there is no node_modules
        #     on the runner; and `uv tool install` writes outside the repo.
        #     Measured locally, `.venv` carries 6 packages (amvcp declares no
        #     dependencies), so expect the shipped count a few above 288 — not
        #     orders of magnitude. 288 is a LOWER BOUND, not the artifact.
        #  3. This workflow has never executed. Nothing here has been observed
        #     on a runner; the first real evidence arrives with the next
        #     publish.py release. When it does, compare sbom.spdx.json's actual
        #     package count against the 288 above and correct this comment.
        # Do not re-measure on a local checkout either: the working tree holds
        # ~130MB of untracked node_modules CI never sees, which inflates any
        # count taken there. Always measure a `git archive` extraction.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          # Uploaded explicitly by the release step below, for determinism.
          upload-release-assets: false
          upload-artifact: false

      - name: compute per-asset SHA256SUMS
        # Checksum every release asset so consumers can verify integrity.
        # SHA256SUMS is itself uploaded alongside the files it covers.
        run: |
          set -e
          : > SHA256SUMS
          sha256sum sbom.spdx.json >> SHA256SUMS
          cat SHA256SUMS

      - name: extract changelog section for this tag
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Convert "v1.2.3" -> "1.2.3" so we can match `## [1.2.3] — ...`
          version="${TAG#v}"
          python3 - <<'PY' "$version"
          import os
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md")
          if not changelog.is_file():
              # No CHANGELOG -> emit a stub note. gh release create still
              # works, the user can edit the body in the GitHub UI.
              note = f"Release {version}.\n\n(no CHANGELOG.md found)\n"
          else:
              text = changelog.read_text(encoding="utf-8")
              # Match the version header and capture everything until the
              # next `## ` header at column 0 (or end of file).
              pattern = re.compile(
                  rf"^##\s*\[{re.escape(version)}\][^\n]*\n(.*?)(?=^##\s|\Z)",
                  re.MULTILINE | re.DOTALL,
              )
              match = pattern.search(text)
              if match:
                  note = match.group(1).strip() + "\n"
              else:
                  note = f"Release {version}.\n\n(no CHANGELOG section found)\n"

          notes_path = Path(os.environ["GITHUB_WORKSPACE"]) / "release-notes.md"
          notes_path.write_text(note, encoding="utf-8")
          print(f"Wrote {len(note)} bytes to {notes_path}")
          PY

      - name: create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # publish.py S10 may have already created the GitHub Release with
          # --generate-notes. If so, we prefer the CHANGELOG-extracted body
          # over auto-generated notes — so we update in place. Otherwise,
          # create from scratch.
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag
            gh release upload "$TAG" sbom.spdx.json SHA256SUMS --clobber
          else
            gh release create "$TAG" sbom.spdx.json SHA256SUMS \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: attest build provenance
        # SLSA build-provenance over the release assets. Needs id-token: write
        # + attestations: write (declared on the job). Recorded in the repo's
        # attestations store; verifiable with `gh attestation verify`.
        # SHA256SUMS is deliberately NOT a subject — it only restates the
        # digest the attestation already binds, so attesting it proves nothing
        # extra and would fail the run if the checksum step is ever reshaped.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.spdx.json

      - name: summary
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Release created"
            echo
            echo "- Tag: \`${TAG}\`"
            echo "- Repo: \`${REPO}\`"
            echo "- URL: https://github.com/${REPO}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
