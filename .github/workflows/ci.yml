name: ci

# Canonical CI workflow.
#
# The check-run names below MUST stay exactly `Lint`, `Validate`, `Test` (bare
# job display names — not `workflow / job` format). The CPV
# `cpv-setup-branch-rules` CLI relies on those three names verbatim when it
# wires up GitHub branch-protection required-status-checks. Renaming a job
# here silently breaks the protection rule.

on:
  push:
    # B5 (canonical-pipeline-migration step 5) — include `master` for
    # rename-safe future-proofing. The plugin uses `main` exclusively, but
    # canon ships [main, master] so a future default-branch rename keeps
    # CI firing on the new branch name without an extra commit.
    branches: [main, master]
  # pull_request without an explicit branches filter — gh-actions.md says
  # PR events should run against the PR target branch automatically.
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # IMPORTANT: display name must remain `Lint` — see file header.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: ruff check
        run: |
          uv tool install ruff
          ruff check .

      - name: actionlint
        # B1 (TRDD-5f41ad36) — actionlint catches GitHub Actions schema
        # bugs (the SCANDIR `env:` regression that slipped past code
        # review last cycle would have been a one-line failure here).
        # Pinned to commit SHA per the project gh-actions.md rule —
        # tag-rewriting attacks on third-party actions are real.
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - name: shellcheck
        # E2 — pin to the latest stable tag instead of @master. The
        # action's own README recommends pinning so a tag-rewriting
        # supply-chain attack can't slip in.
        # B4 (TRDD-5f41ad36) — upgraded from tag pin (`@2.0.0`) to full
        # commit-SHA pin per the project gh-actions.md rule.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          # E1 — the action reads `scandir` from its `inputs:` (i.e.
          # the `with:` block), NOT from the `env:` block. Setting it
          # under `env:` was a silent no-op and the action defaulted
          # to scanning the entire repo (including `vendor/`). Place
          # it in `with:` and add `additional_files` for the two
          # specific non-shell files we want checked, plus
          # `ignore_paths: vendor` to belt-and-braces exclude vendored
          # third-party shell code.
          scandir: './scripts'
          additional_files: 'tests/server.py git-hooks/pre-push'
          ignore_paths: vendor
        env:
          # The dev-browser test wrapper relies on bash arrays; we only
          # check our own shell scripts, not the vendored regex-vis sources.
          SHELLCHECK_OPTS: -e SC1091

  validate:
    # IMPORTANT: display name must remain `Validate` — see file header.
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: validate plugin
        # Single source of truth: publish.py::_gate_validate() handles the
        # exit-code classification AND applies the documented-known-exception
        # allowlist declared in plugin.json::cpv._intentional_validator_false_positives.
        # See step 14 commit message for the full rationale.
        #
        # publish.py --gate-validate runs ONLY G3 (no version-bump check,
        # no dev-browser tests, no marketplace check) — those gates either
        # already passed pre-push, do not apply in CI, or need a different
        # runner setup. Returns 0 if G3 PASSes (all blocking findings
        # allowlisted), non-0 if any non-allowlisted blocking finding remains.
        run: uv run python scripts/publish.py --gate-validate

  test:
    # IMPORTANT: display name must remain `Test` — see file header.
    #
    # The 46-test dev-browser-driven suite (tests/run-all-tests.py) cannot
    # run on stock GitHub runners: it needs the `dev-browser` CLI which
    # depends on a real Chrome instance and persistent state, neither of
    # which are available in headless ubuntu-latest. The suite is enforced
    # locally via the git-hooks/pre-push hook before any push to origin.
    #
    # This job is intentionally a CI smoke-check that the test runner is
    # syntactically valid Python — it parses run-all-tests.py, run-tests.py,
    # and server.py without executing them. Restore the full suite when a
    # hosted dev-browser runner becomes available.
    #
    # B3 (TRDD-5f41ad36) — runs on both ubuntu-latest AND macos-latest so
    # path-handling differences (case-sensitivity, NamedTemporaryFile
    # behaviour, signal/process group semantics) get caught before they
    # break developers on macOS. The smoke check is just `python -m
    # py_compile` so the macos run adds ~30s — well worth the early signal.
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: smoke-check the test runner
        run: |
          # Compile-only check: catches Python syntax errors in the test
          # runner without spinning up Chrome / dev-browser.
          uv run --python 3.12 python -m py_compile \
            tests/run-all-tests.py \
            tests/run-tests.py \
            tests/server.py

      - name: note about dev-browser suite
        run: |
          {
            echo "## Test job — note"
            echo
            echo "The full 46-test dev-browser suite cannot run on stock GitHub"
            echo "runners. It is enforced locally via the git-hooks/pre-push hook."
            echo
            echo "This job verified that the test runner Python sources parse"
            echo "without syntax errors."
          } >> "$GITHUB_STEP_SUMMARY"

  commitlint:
    # B2 (TRDD-5f41ad36) — Conventional Commits gate. Fails the PR build
    # if any commit on the PR does NOT match the Conventional Commits
    # spec (feat: / fix: / chore: / docs: / refactor: / test: / ci: /
    # build: / perf: / revert: / style: prefixes). PR-only — push events
    # to main are merge commits authored by GitHub which are not
    # conventional-format and would needlessly fail.
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: lint commit messages
        # Pinned to commit SHA per the project gh-actions.md rule.
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          # Conventional Commits ruleset — validates type, scope, subject
          # length, body line wrap. Same ruleset cliff.toml uses to
          # parse commit history into the changelog, so a commit that
          # passes here will produce a clean CHANGELOG entry.
          configFile: ${{ github.workspace }}/.commitlintrc.json

  lint-security:
    # B6 (canonical-pipeline-migration step 8) — Mega-Linter security
    # scanners (Bandit + Checkov + Gitleaks + Trivy + Cspell + JSCPD)
    # plus a second pass of ruff/mypy/shellcheck/shfmt/json/yaml/markdown
    # lint. Configured via .mega-linter.yml. The existing `lint` job
    # above still runs ruff + actionlint + shellcheck inline as a fast
    # gate — this job is the heavier supply-chain-security pass.
    #
    # Timeout: 15 min — Mega-Linter is slow on first run (downloads
    # ~5 GB of linter images); cached subsequent runs take ~3-5 min.
    # continue-on-error: true intentionally — the security scanners
    # may flag pre-existing findings that need triage; this job
    # surfaces them as advisory notices without blocking the build
    # until that triage is complete. Promote to fail-on-error in a
    # future PR once the initial findings are addressed.
    name: Lint-Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          # Need full history so Gitleaks can scan all commits, not
          # just the latest one.
          fetch-depth: 0

      - name: Mega-Linter (security scanners + repo lint)
        # Pinned to commit SHA per the project gh-actions.md rule.
        uses: oxsecurity/megalinter@0e3ce9b9c8c10effb9b269509cc47ca17cae31c7 # v9.5.0
        env:
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: archive mega-linter reports
        # Always archive even on failure so the developer can download
        # the per-linter sub-reports for triage.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mega-linter-reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 14
