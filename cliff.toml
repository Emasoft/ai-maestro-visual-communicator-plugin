# git-cliff configuration for changelog generation
# https://git-cliff.org

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
footer = """
---
*Generated by [git-cliff](https://git-cliff.org)*
"""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/Emasoft/ai-maestro-visual-communicator-plugin/issues/${2}))" },
  { pattern = '\s+$', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous Tasks" },
  # NOTE: there is deliberately NO `{ body = ".*security" }` parser here.
  # It was a bare substring match on the commit BODY, and it mis-filed the
  # v0.8.0 release commit (2e4cfb4) under "Security" because that body
  # mentions Mermaid's `securityLevel: 'loose'` config key. It also could
  # never do the job it looked like it was doing: parsers are first-match-
  # wins in order, and every conventional type above already matches
  # earlier, so a `fix:` commit with a security body never reached it. Its
  # only measurable effect was the false positive. Real security commits
  # still group correctly — git-cliff derives the group from the
  # conventional type, so `security: ...` lands under "Security" on its
  # own. Verified by generating the changelog with and without this line:
  # with it, Security had 2 entries (1 genuine + the release commit);
  # without it, 1 (the genuine one).
  { message = "^revert", group = "Revert" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
