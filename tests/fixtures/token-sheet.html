<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>design-tokens — token contact-sheet fixture</title>
<!-- The contact-sheet stylesheet: derived --vc-state-* tokens, the
     .vc-state overlay, the role-map family, the sheet chrome and the
     Tailwind-shaped utility classes. Co-located with the HTML; the
     test runner syncs it from scripts/ on every run. -->
<link rel="stylesheet" href="amvcp-tokens.css">
<style>
  /* No nested scrollbars — the document is the only scroller. */
  html, body { overflow-x: auto; }
  body {
    margin: 0;
    /* The body itself reads --vc-* so a hot-swap restyles the page
       chrome, not just the mounted sheet. */
    background: var(--vc-color-canvas, #faf6ee);
    color: var(--vc-color-content, #1f1a14);
    font-family: var(--vc-font-body, system-ui, sans-serif);
  }
</style>
</head>
<body>
<!-- The mount point — the dev-browser test calls
     amvcpTokenSheet.mountContactSheet(designmd, this container). -->
<div id="vc-sheet-mount"></div>

<!-- The embedded DESIGN.md — the engine's token source of truth for
     this page. Content mirrors tests/fixtures/DESIGN-tokens-sample.md
     (the "Trust Indigo" preset) so the sheet exercises every new token
     group: 5-level elevation, 8+8 motion, the z-index scale, the code
     palette. -->
<script type="text/design-md" id="ve-designmd">
---
designmd_version: 1
meta:
  name: "Trust Indigo"
  default_theme: light
colors:
  light:
    canvas: "#f7f8fb"
    surface: "#fefefe"
    surface-raised: "#fbfcfe"
    surface-sunken: "#e8ecf4"
    content: "#16181d"
    content-muted: "#4c505b"
    content-subtle: "#7d8290"
    border: "#dde1ea"
    border-strong: "#bcc2d1"
    accent: "#1d4ed8"
    on-accent: "#fdfefe"
    success: "#1f8a5a"
    warning: "#b9770e"
    danger: "#c0392b"
    info: "#1d4ed8"
  dark:
    canvas: "#0e1014"
    surface: "#181b22"
    surface-raised: "#21252e"
    surface-sunken: "#08090c"
    content: "#e9ebf1"
    content-muted: "#a3a8b6"
    content-subtle: "#71768a"
    border: "#2b2f3a"
    border-strong: "#434956"
    accent: "#4f9bf0"
    on-accent: "#0e1014"
    success: "#52b88a"
    warning: "#d8a13e"
    danger: "#e0685a"
    info: "#4f9bf0"
typography:
  font-heading: "Newsreader, Georgia, serif"
  font-body: "system-ui, -apple-system, Segoe UI, sans-serif"
  font-mono: "JetBrains Mono, ui-monospace, monospace"
  scale: [12, 14, 16, 20, 24, 32, 48]
  weight-regular: 400
  weight-medium: 500
  weight-bold: 700
  line-height: 1.55
spacing:
  scale: [4, 8, 12, 16, 24, 32, 48, 64]
radius:
  none: 0
  sm: 4
  md: 8
  lg: 12
  xl: 16
  full: 9999
elevation:
  shadow-0: "none"
  shadow-1: "0 1px 2px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.10)"
  shadow-2: "0 2px 4px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.12)"
  shadow-3: "0 4px 8px rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.14)"
  shadow-4: "0 8px 16px rgba(0,0,0,0.10), 0 16px 40px rgba(0,0,0,0.18)"
  shadow-border: "0 0 0 1px rgba(0,0,0,0.08)"
motion:
  duration-instant:  50
  duration-fast:     100
  duration-quick:    200
  duration-base:     300
  duration-moderate: 400
  duration-slow:     500
  duration-lazy:     700
  duration-glacial:  1000
  easing-standard:         "cubic-bezier(0.2,0,0,1)"
  easing-decel:            "cubic-bezier(0,0,0,1)"
  easing-accel:            "cubic-bezier(0.3,0,1,1)"
  easing-emphasized-decel: "cubic-bezier(0.05,0.7,0.1,1)"
  easing-emphasized-accel: "cubic-bezier(0.3,0,0.8,0.15)"
  easing-spring:           "cubic-bezier(0.175,0.885,0.32,1.275)"
  easing-bounce:           "cubic-bezier(0.34,1.56,0.64,1)"
  easing-linear:           "linear"
z-index:
  behind:   -1
  base:     0
  raised:   10
  dropdown: 100
  sticky:   200
  overlay:  300
  modal:    400
  toast:    500
  tooltip:  600
code:
  keyword:     "#1d4ed8"
  string:      "#1f8a5a"
  number:      "#c0392b"
  comment:     "#7d8290"
  type:        "#4f9bf0"
  variable:    "#16181d"
  function:    "#9a5fc4"
  constant:    "#1d4ed8"
  operator:    "#4c505b"
  punctuation: "#7d8290"
  tag:         "#c0392b"
  attribute:   "#1f8a5a"
---

# Trust Indigo

Calm corporate blue — royal-blue accent (anti-slop safe).
</script>

<!-- Load order matters: the engine first (installs window.amvcpDesignMd),
     then the runtime (boots the engine, applies the embedded DESIGN.md,
     installs window.__veDesignMd), then the design-tokens helper layer,
     then the contact-sheet renderer. All four are co-located bundles
     synced into fixtures/ by run-tests.py. -->
<script src="amvcp-designmd.js"></script>
<script src="amvcp-runtime.js"></script>
<script src="amvcp-tokens.js"></script>
<script src="amvcp-token-sheet.js"></script>
</body>
</html>
