<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Fixture for scripts/amvcp-editor-template.js — the prompt/template tuner
     (TRDD-1627a698 gap #20). Exercises its load-bearing guarantees:
       1. the FENCED embedded DESIGN.md actually drives the --vc-* tokens
          (sentinel surface-sunken #f1ece1; a fenceless block would silently
          fall back to the built-in palette);
       2. variable inputs + an initial preview render from the JSON model;
       3. editing a var live-updates the preview text;
       4. a select-type var switches the re-render;
       5. Export pushes one kind:"element" entry into window.veSelection
          carrying {template, values, rendered};
       6. a live data-ve-theme flip re-paints the editor. -->
<title>editor-template fixture</title>
<style>
  :root { --ve-accent: var(--vc-color-accent, #b8861f); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: auto; }
  body {
    background: var(--vc-color-canvas, #faf6ee);
    color: var(--vc-color-content, #1f1a14);
    font: 16px/1.55 var(--vc-font-body, system-ui, sans-serif);
  }
  main { max-width: 1180px; margin: 0 auto; padding: 48px 32px 96px; }
  h1 { font: 600 22px/1.3 var(--vc-font-heading, system-ui, sans-serif); margin-bottom: 24px; }
</style>

<script type="text/design-md" id="ve-designmd">
---
designmd_version: 1
meta:
  name: "Editor Template Fixture"
  default_theme: light
colors:
  light:
    canvas: "#faf6ee"
    surface: "#fffefb"
    surface-raised: "#fffdf8"
    surface-sunken: "#f1ece1"
    content: "#1f1a14"
    content-muted: "#5b5343"
    content-subtle: "#8a8170"
    border: "#e3dcc9"
    border-strong: "#c9bfa3"
    accent: "#b8861f"
    on-accent: "#fffdf9"
    success: "#3a6b5c"
    warning: "#a8791f"
    danger: "#a84a32"
    info: "#3464a8"
  dark:
    canvas: "#16130d"
    surface: "#211c14"
    surface-raised: "#2a241a"
    surface-sunken: "#0f0d09"
    content: "#f3ecdd"
    content-muted: "#b8ad96"
    content-subtle: "#857c68"
    border: "#3a3325"
    border-strong: "#564c36"
    accent: "#e0aa3e"
    on-accent: "#16130d"
    success: "#6fae9b"
    warning: "#d8aa54"
    danger: "#dd8068"
    info: "#6f9bd8"
typography:
  font-heading: "IBM Plex Sans, system-ui, sans-serif"
  font-body: "IBM Plex Sans, system-ui, sans-serif"
  font-mono: "IBM Plex Mono, ui-monospace, Menlo, monospace"
  scale: [12, 14, 16, 20, 24, 32, 48]
  weight-regular: 400
  weight-medium: 500
  weight-bold: 700
  line-height: 1.55
spacing:
  scale: [4, 8, 12, 16, 24, 32, 48, 64]
radius:
  none: 0
  sm: 4
  md: 8
  lg: 12
  xl: 16
  full: 9999
motion:
  duration-fast: 160
  duration-slow: 560
  easing-standard: "cubic-bezier(0.16,1,0.3,1)"
  easing-decel: "cubic-bezier(0,0,0,1)"
---
</script>

<script src="amvcp-designmd.js"></script>
<script src="amvcp-runtime.js"></script>
<script src="amvcp-editor-template.js"></script>
</head>
<body>
<main id="main">
  <h1>Prompt tuner</h1>
  <div class="ve-editor-template"
       data-ve-id="ve-tpl-summary"
       data-ve-label="Summary prompt template">
    <script type="application/json">
    {
      "template": "Write a {{tone}} summary of {{topic}} in {{count}} words. Audience: {{audience}}.",
      "variables": [
        { "key": "tone", "label": "Tone", "default": "concise", "type": "text" },
        { "key": "topic", "label": "Topic", "default": "the quarterly report", "type": "text" },
        { "key": "count", "label": "Word count", "default": "120",
          "type": "select", "options": ["80", "120", "200", "400"] },
        { "key": "audience", "label": "Audience", "default": "executives",
          "type": "textarea" }
      ]
    }
    </script>
  </div>
</main>
</body>
</html>
