<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Fixture for the feature-flag toggle editor (TRDD-1627a698 gap #19).
     Exercises:
       1. grouped switches render from the embedded flag spec;
       2. flipping a flag toggles aria-checked + state;
       3. a flag whose `requires` are off shows its PRE-RENDERED warning
          row (no injected geometry) and clears when satisfied;
       4. "Copy diff" lands a kind:"element" entry in window.veSelection
          carrying the changed-flag diff text (export rides the runtime
          selection channel);
       5. a live data-ve-theme flip re-paints via --vc-* tokens.
     The FENCED embedded DESIGN.md (warm palette, sentinel surface-sunken
     #f1ece1) actually drives the tokens — fenceless blocks silently fall
     back to the built-in palette, so the fence is load-bearing. -->
<title>editor-toggles fixture</title>
<style>
  :root { --ve-accent: var(--vc-color-accent, #b8861f); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: auto; }
  body {
    background: var(--vc-color-canvas, #faf6ee);
    color: var(--vc-color-content, #1f1a14);
    font: 16px/1.55 var(--vc-font-body, system-ui, sans-serif);
  }
  main { max-width: 720px; margin: 0 auto; padding: 40px 28px 96px; }
  h1 { font-size: 22px; margin-bottom: 14px; }
</style>

<script type="text/design-md" id="ve-designmd">
---
designmd_version: 1
meta:
  name: "Editor Toggles Fixture"
  default_theme: light
colors:
  light:
    canvas: "#faf6ee"
    surface: "#fffefb"
    surface-raised: "#fffdf8"
    surface-sunken: "#f1ece1"
    content: "#1f1a14"
    content-muted: "#5b5343"
    content-subtle: "#8a8170"
    border: "#e3dcc9"
    border-strong: "#c9bfa3"
    accent: "#b8861f"
    on-accent: "#fffdf9"
    success: "#3a6b5c"
    warning: "#a8791f"
    danger: "#a84a32"
    info: "#3464a8"
  dark:
    canvas: "#16130d"
    surface: "#211c14"
    surface-raised: "#2a241a"
    surface-sunken: "#0f0d09"
    content: "#f3ecdd"
    content-muted: "#b8ad96"
    content-subtle: "#857c68"
    border: "#3a3325"
    border-strong: "#564c36"
    accent: "#e0aa3e"
    on-accent: "#16130d"
    success: "#6fae9b"
    warning: "#d8aa54"
    danger: "#dd8068"
    info: "#6f9bd8"
typography:
  font-heading: "IBM Plex Sans, system-ui, sans-serif"
  font-body: "IBM Plex Sans, system-ui, sans-serif"
  font-mono: "IBM Plex Mono, ui-monospace, Menlo, monospace"
  scale: [12, 14, 16, 20, 24, 32, 48]
  weight-regular: 400
  weight-medium: 500
  weight-bold: 700
  line-height: 1.55
spacing:
  scale: [4, 8, 12, 16, 24, 32, 48, 64]
radius:
  none: 0
  sm: 4
  md: 8
  lg: 12
  xl: 16
  full: 9999
motion:
  duration-fast: 160
  duration-slow: 560
  easing-standard: "cubic-bezier(0.16,1,0.3,1)"
  easing-decel: "cubic-bezier(0,0,0,1)"
---
</script>

<script src="amvcp-designmd.js"></script>
<script src="amvcp-runtime.js"></script>
</head>
<body>
<main>
  <h1>Feature-flag editor — fixture</h1>

  <div class="ve-editor-toggles" data-ve-id="toggles:rollout-flags">
    <script type="application/json">
      {
        "title": "Rollout configuration",
        "exportId": "flag-diff:rollout",
        "groups": [
          {
            "label": "Delivery",
            "flags": [
              { "key": "canary",    "label": "Canary rollout",  "default": false },
              { "key": "telemetry", "label": "Telemetry",        "default": true  },
              { "key": "autoRoll",  "label": "Auto-rollback",    "default": false,
                "requires": ["telemetry", "canary"] }
            ]
          },
          {
            "label": "Experimental",
            "flags": [
              { "key": "newUi",     "label": "New UI shell",     "default": false },
              { "key": "betaApi",   "label": "Beta API surface", "default": false,
                "requires": ["newUi"] }
            ]
          }
        ]
      }
    </script>
  </div>
</main>

<!-- Manual init so the boot script can record readiness for the test,
     mirroring the form-inputs fixture pattern. -->
<script>window.__vcEditorTogglesManualInit = true;</script>
<script src="amvcp-editor-toggles.js"></script>
<script>
(function () {
  function boot() {
    try {
      document.documentElement.setAttribute('data-ve-theme', 'light');
      window.amvcpEditorToggles.injectStyles(document);
      window.amvcpEditorToggles.init(document);
      window.__etFixtureReady = true;
    } catch (e) {
      window.__etFixtureError = String(e && e.message || e);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else { boot(); }
})();
</script>
</body>
</html>
