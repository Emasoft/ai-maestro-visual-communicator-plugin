<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>component-variant-matrix — fixture</title>
<style>
  /* No nested scrollbars — the document is the only scroller. The
     component-variants module injects its own --vc-* themed stylesheet;
     this page only sets the body chrome off the same tokens so a
     hot-swap re-themes the page, not just the mounted matrix. */
  html, body { overflow-x: auto; }
  body {
    margin: 0;
    background: var(--vc-color-canvas, #faf6ee);
    color: var(--vc-color-content, #1f1a14);
    font-family: var(--vc-font-body, system-ui, sans-serif);
  }
</style>
</head>
<body>
<!-- The mount point — the dev-browser test calls
     amvcpComponentVariants.mountVariantMatrix(schema, designmd, this). -->
<div id="vc-cvm-mount"></div>

<!-- The embedded DESIGN.md — the engine's token source of truth for
     this page. Mirrors the "Trust Indigo" preset used by the token-sheet
     fixture so the matrix exercises surface-raised / surface-sunken,
     the shadow scale, accent + danger, the radius + z scales. -->
<script type="text/design-md" id="ve-designmd">
---
designmd_version: 1
meta:
  name: "Trust Indigo"
  default_theme: light
colors:
  light:
    canvas: "#f7f8fb"
    surface: "#fefefe"
    surface-raised: "#fbfcfe"
    surface-sunken: "#e8ecf4"
    content: "#16181d"
    content-muted: "#4c505b"
    content-subtle: "#7d8290"
    border: "#dde1ea"
    border-strong: "#bcc2d1"
    accent: "#1d4ed8"
    on-accent: "#fdfefe"
    success: "#1f8a5a"
    warning: "#b9770e"
    danger: "#c0392b"
    info: "#1d4ed8"
  dark:
    canvas: "#0e1014"
    surface: "#181b22"
    surface-raised: "#21252e"
    surface-sunken: "#08090c"
    content: "#e9ebf1"
    content-muted: "#a3a8b6"
    content-subtle: "#71768a"
    border: "#2b2f3a"
    border-strong: "#434956"
    accent: "#4f9bf0"
    on-accent: "#0e1014"
    success: "#52b88a"
    warning: "#d8a13e"
    danger: "#e0685a"
    info: "#4f9bf0"
typography:
  font-heading: "Newsreader, Georgia, serif"
  font-body: "system-ui, -apple-system, Segoe UI, sans-serif"
  font-mono: "JetBrains Mono, ui-monospace, monospace"
  scale: [12, 14, 16, 20, 24, 32, 48]
  weight-regular: 400
  weight-medium: 500
  weight-bold: 700
  line-height: 1.55
spacing:
  scale: [4, 8, 12, 16, 24, 32, 48, 64]
radius:
  none: 0
  sm: 4
  md: 8
  lg: 12
  xl: 16
  full: 9999
elevation:
  shadow-0: "none"
  shadow-1: "0 1px 2px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.10)"
  shadow-2: "0 2px 4px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.12)"
  shadow-3: "0 4px 8px rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.14)"
  shadow-4: "0 8px 16px rgba(0,0,0,0.10), 0 16px 40px rgba(0,0,0,0.18)"
  shadow-border: "0 0 0 1px rgba(0,0,0,0.08)"
motion:
  duration-instant:  50
  duration-fast:     100
  duration-quick:    200
  duration-base:     300
  duration-moderate: 400
  duration-slow:     500
  duration-lazy:     700
  duration-glacial:  1000
  easing-standard:         "cubic-bezier(0.2,0,0,1)"
  easing-decel:            "cubic-bezier(0,0,0,1)"
  easing-accel:            "cubic-bezier(0.3,0,1,1)"
  easing-emphasized-decel: "cubic-bezier(0.05,0.7,0.1,1)"
  easing-emphasized-accel: "cubic-bezier(0.3,0,0.8,0.15)"
  easing-spring:           "cubic-bezier(0.175,0.885,0.32,1.275)"
  easing-bounce:           "cubic-bezier(0.34,1.56,0.64,1)"
  easing-linear:           "linear"
z-index:
  behind:   -1
  base:     0
  raised:   10
  dropdown: 100
  sticky:   200
  overlay:  300
  modal:    400
  toast:    500
  tooltip:  600
---

# Trust Indigo

Calm corporate blue — royal-blue accent (anti-slop safe).
</script>

<!-- The sample schema the matrix renders. A `state` primary axis (so the
     renderer emits an axis band per state) crossed with structural
     treatments. Each variant carries axisValues.state, a treatment kind
     (resolving to the built-in --vc-* token sets) and a JSX-ish snippet
     for the click-to-copy export affordance. -->
<script type="application/json" id="ve-variant-schema">
{
  "component": "Card",
  "description": "Six structural treatments of the <Card /> component across interaction states.",
  "axes": {
    "state": ["default", "hover", "disabled"],
    "intent": ["neutral", "accent", "danger"]
  },
  "render": {
    "variants": [
      { "key": "default-flat", "label": "Flat", "kind": "flat",
        "axisValues": { "state": "default" },
        "note": "best for: dense lists on tinted backgrounds",
        "snippet": "<Card variant=\"flat\" />" },
      { "key": "default-outlined", "label": "Outlined", "kind": "outlined",
        "axisValues": { "state": "default" },
        "note": "best for: default content cards",
        "snippet": "<Card variant=\"outlined\" />" },
      { "key": "default-elevated", "label": "Elevated", "kind": "elevated",
        "axisValues": { "state": "default" },
        "note": "best for: draggable items, popovers",
        "snippet": "<Card variant=\"elevated\" shadow=\"md\" />" },
      { "key": "hover-accent", "label": "Accent", "kind": "accent",
        "axisValues": { "state": "hover" },
        "note": "best for: pinned or priority items",
        "snippet": "<Card variant=\"outlined\" accent=\"brand\" />" },
      { "key": "hover-inset", "label": "Inset", "kind": "inset",
        "axisValues": { "state": "hover" },
        "note": "best for: nested cards inside panels",
        "snippet": "<Card variant=\"filled\" tone=\"sunken\" />" },
      { "key": "disabled-danger", "label": "Danger", "kind": "danger",
        "axisValues": { "state": "disabled" },
        "note": "best for: destructive or error states",
        "snippet": "<Card variant=\"outlined\" intent=\"danger\" />" }
    ]
  }
}
</script>

<!-- Load order: engine first (installs window.amvcpDesignMd), then the
     runtime (boots the engine, applies the embedded DESIGN.md, installs
     window.__veDesignMd + the fixed-interaction selection layer), then
     the component-variants renderer. Synced into fixtures/ by run-tests.py. -->
<script src="amvcp-designmd.js"></script>
<script src="amvcp-runtime.js"></script>
<script src="amvcp-component-variants.js"></script>
</body>
</html>
