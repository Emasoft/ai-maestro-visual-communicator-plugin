<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Table-form (multi) Test Fixture</title>
<style>
  body { margin: 0; padding: 32px; background: #faf6ee; color: #1f1a14;
         font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 86ch; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; margin: 16px 0; }
  th, td { border: 1px solid rgba(0,0,0,0.12); padding: 10px 14px; text-align: left; }
</style>
</head>
<body>
<main>
  <h1>Pick all the languages you use</h1>
  <table data-ve-id="opts-multi" data-ve-type="table-form" data-ve-mode="multi"
         data-ve-label="Pick all the languages you use">
    <thead><tr><th>Language</th><th>Notes</th></tr></thead>
    <tbody>
      <tr data-ve-row-id="opt-py"   data-ve-row-label="Python">
        <td>Python</td><td>Batteries included.</td>
      </tr>
      <tr data-ve-row-id="opt-go"   data-ve-row-label="Go">
        <td>Go</td><td>Static binaries.</td>
      </tr>
      <tr data-ve-row-id="opt-rust" data-ve-row-label="Rust">
        <td>Rust</td><td>Memory safety.</td>
      </tr>
    </tbody>
  </table>
</main>
<script src="amvcp-runtime.js"></script>
</body>
</html>
