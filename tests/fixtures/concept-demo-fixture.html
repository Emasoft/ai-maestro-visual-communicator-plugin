<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>concept-demo — fixture</title>
<style>
  /* No nested scrollbars — the document is the only scroller. The
     concept-demo module injects its own --vc-* themed stylesheet; this
     page only sets body chrome off the same tokens so a hot-swap /
     theme flip re-themes the page, not just the mounted demo. */
  :root { --ve-accent: var(--vc-color-accent, #b8861f); }
  html, body { overflow-x: auto; }
  body {
    margin: 0; padding: 32px;
    background: var(--vc-color-canvas, #faf6ee);
    color: var(--vc-color-content, #1f1a14);
    font-family: var(--vc-font-body, system-ui, sans-serif);
  }
  main { max-width: 880px; margin: 0 auto; }
</style>

<!-- FENCED embedded DESIGN.md — warm palette, sentinel surface-sunken
     #f1ece1 (regression guard: parseDesignMd is fail-fast; a fenceless
     block silently falls back to the built-in palette). Mirrors the
     graphviz-template-fixture convention. -->
<script type="text/design-md" id="ve-designmd">
---
designmd_version: 1
meta:
  name: "Concept Demo Fixture"
  default_theme: light
colors:
  light:
    canvas: "#faf6ee"
    surface: "#fffefb"
    surface-raised: "#fffdf8"
    surface-sunken: "#f1ece1"
    content: "#1f1a14"
    content-muted: "#5b5343"
    content-subtle: "#8a8170"
    border: "#e3dcc9"
    border-strong: "#c9bfa3"
    accent: "#b8861f"
    on-accent: "#fffdf9"
    success: "#3a6b5c"
    warning: "#a8791f"
    danger: "#a84a32"
    info: "#3464a8"
  dark:
    canvas: "#16130d"
    surface: "#211c14"
    surface-raised: "#2a241a"
    surface-sunken: "#0f0d09"
    content: "#f3ecdd"
    content-muted: "#b8ad96"
    content-subtle: "#857c68"
    border: "#3a3325"
    border-strong: "#564c36"
    accent: "#e0aa3e"
    on-accent: "#16130d"
    success: "#6fae9b"
    warning: "#d8aa54"
    danger: "#dd8068"
    info: "#6f9bd8"
typography:
  font-heading: "IBM Plex Sans, system-ui, sans-serif"
  font-body: "IBM Plex Sans, system-ui, sans-serif"
  font-mono: "IBM Plex Mono, ui-monospace, Menlo, monospace"
  scale: [12, 14, 16, 20, 24, 32, 48]
  weight-regular: 400
  weight-medium: 500
  weight-bold: 700
  line-height: 1.55
spacing:
  scale: [4, 8, 12, 16, 24, 32, 48, 64]
radius:
  none: 0
  sm: 4
  md: 8
  lg: 12
  xl: 16
  full: 9999
motion:
  duration-fast: 160
  duration-slow: 560
  easing-standard: "cubic-bezier(0.16,1,0.3,1)"
  easing-decel: "cubic-bezier(0,0,0,1)"
---

# Concept Demo Fixture

Warm editorial palette — gold accent (anti-slop safe).
</script>
</head>
<body>
<main>
  <!-- Explicit-mount point: the dev-browser test reads #ve-concept-spec
       and calls amvcpConceptDemo.mountConceptDemo(spec, this). -->
  <div id="vc-cd-mount"></div>

  <!-- Declarative-scan host: the module auto-renders this on boot from
       its inline .vc-concept-spec block (exercises scanAndRender). -->
  <div data-vc-concept-demo data-vc-concept-id="declared-demo">
    <script type="application/json" class="vc-concept-spec">
    {
      "title": "Compound interest",
      "mapping": "Principal grows by the rate each period; the bars show balance over the first three periods.",
      "visual": "bars",
      "params": [
        { "key": "p0", "label": "Period 1", "min": 0, "max": 100, "step": 1, "default": 20, "unit": "" },
        { "key": "p1", "label": "Period 2", "min": 0, "max": 100, "step": 1, "default": 45, "unit": "" },
        { "key": "p2", "label": "Period 3", "min": 0, "max": 100, "step": 1, "default": 80, "unit": "" }
      ],
      "glossary": [
        { "term": "Principal", "def": "The starting amount before any growth." },
        { "term": "Rate", "def": "The per-period growth fraction." }
      ]
    }
    </script>
  </div>
</main>

<!-- The spec the test mounts explicitly. A 'curve' visual with two
     params so the test can move the steepness slider and assert the
     curve path attribute changed while no DOM nodes were added. -->
<script type="application/json" id="ve-concept-spec">
{
  "title": "Easing curve",
  "mapping": "The steepness exponent and amplitude shape a generic power curve — the manipulable visual of an easing concept.",
  "visual": "curve",
  "params": [
    { "key": "steepness", "label": "Steepness", "min": 0, "max": 10, "step": 0.5, "default": 4, "unit": "" },
    { "key": "amplitude", "label": "Amplitude", "min": 0, "max": 100, "step": 1, "default": 70, "unit": "%" }
  ],
  "glossary": [
    { "term": "Easing", "def": "A function mapping linear progress to a perceptually smoother curve." },
    { "term": "Amplitude", "def": "The peak height the curve reaches at the end of the range." }
  ]
}
</script>

<!-- Load order: engine first (window.amvcpDesignMd), then the runtime
     (boots the engine, applies the embedded DESIGN.md, installs
     window.__veDesignMd + the fixed-interaction selection layer), then
     the concept-demo renderer. Synced into fixtures/ by run-tests.py. -->
<script src="amvcp-designmd.js"></script>
<script src="amvcp-runtime.js"></script>
<script src="amvcp-concept-demo.js"></script>
</body>
</html>
